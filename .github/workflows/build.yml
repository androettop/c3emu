name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: c3emu
          - os: windows-latest
            name: windows-x86_64
            exe: c3emu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies (ALSA, X11, Wayland)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Test
        run: cargo test --release -p c3emu --lib
      - name: Build
        run: cargo build --release -p c3emu --bin c3emu
      - uses: actions/upload-artifact@v4
        with:
          name: c3emu-${{ matrix.name }}
          path: target/release/${{ matrix.exe }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: c3emu-web
          path: site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          mv c3emu-linux-x86_64/c3emu c3emu-linux-x86_64.bin && chmod +x c3emu-linux-x86_64.bin
          mv c3emu-windows-x86_64/c3emu.exe c3emu-windows-x86_64.exe
          (cd c3emu-web && zip -r ../c3emu-web.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/c3emu-linux-x86_64.bin
            dist/c3emu-windows-x86_64.exe
            dist/c3emu-web.zip
